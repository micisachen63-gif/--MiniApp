name="star-journal-rpg-bot"
main="src/index.mjs"
account_id="48259a9f84c8307f8de8ceaf704b9f8f"
compatibility_date="2026-10-14"
compatibility_flags=["nodejs_compat"]
keep_vars=true

[assets]
directory="public"
binding="ASSETS"

[[services]]
binding="RPG_API"
service="elf-rpg-api"

[[durable_objects.bindings]]
name="BOT_COORDINATOR"
class_name="BotCoordinator"

[[migrations]]
tag="star-journal-bot-sqlite-v1"
new_sqlite_classes=["BotCoordinator"]

[[rules]]
type="CompiledWasm"
globs=["**/*.wasm"]
fallthrough=true

[limits]
cpu_ms=30000

[triggers]
crons=["* * * * *"]

[vars]
GROUP_CHAT_ID="-1004342516953"
INVITE_LINK="https://t.me/+5hDQa1rrBv4xMDhl"
