<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妖精男女精繪攻擊動畫審查</title><style>body{margin:0;background:linear-gradient(160deg,#101c2c,#1a3143);color:#eaf5f0;font-family:system-ui,'Microsoft JhengHei',sans-serif;text-align:center}h1{font-size:24px;margin:24px 8px 8px}p{color:#bcd1d4;margin:8px auto;max-width:700px;line-height:1.7}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:24px auto;max-width:1000px}.card{background:#122330;border:1px solid #56747c;border-radius:18px;padding:18px;width:min(88vw,390px)}canvas{width:100%;height:360px;object-fit:contain;background:radial-gradient(ellipse at center,#315364 0%,#182b3b 65%,#122330 100%);border-radius:12px}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}button{background:#3d8a77;color:white;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}input{width:120px}.muted{font-size:13px;color:#95acb9}</style><h1>妖精男女精繪攻擊動畫｜Mini App 審查版</h1><p>本頁使用現有精繪 WebP 攻擊影格轉換的透明 PNG。不是重新繪製完成的 3A 角色模組，先用來確認逐格動作與角色品質。</p><div class="controls"><button id="play">暫停</button><label>每秒影格 <input id="fps" type="range" min="2" max="18" value="9"><span id="fpsn">9</span></label><button id="restart">重新播放</button></div><section class="grid"><div class="card"><h2>女妖精｜12 格</h2><canvas id="f" width="460" height="460"></canvas><p id="frame-f" class="muted"></p></div><div class="card"><h2>男妖精｜10 格</h2><canvas id="m" width="460" height="460"></canvas><p id="frame-m" class="muted"></p></div></section><p class="muted">預覽畫面不影響玩家資料與正式角色屬性。正式版職業三、四轉仍維持鎖定。</p><script>const assets=[{id:'f',cols:4,rows:3,count:12},{id:'m',cols:5,rows:2,count:10}];let running=true,fps=9,time=0,last=0;document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'暫停':'播放'};document.getElementById('restart').onclick=()=>time=0;document.getElementById('fps').oninput=e=>{fps=+e.target.value;document.getElementById('fpsn').textContent=fps};for(const a of assets){a.im=new Image();a.im.src='archer_'+a.id+'_attack.png';}function tick(now){if(last&&running)time+=(now-last)/1000;last=now;for(const a of assets){const im=a.im,c=document.getElementById(a.id),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(!im.complete||!im.naturalWidth)continue;const cw=im.naturalWidth/a.cols,ch=im.naturalHeight/a.rows,frame=Math.floor(time*fps)%a.count;const scale=Math.min(c.width*.95/cw,c.height*.94/ch);ctx.drawImage(im,(frame%a.cols)*cw,Math.floor(frame/a.cols)*ch,cw,ch,(c.width-cw*scale)/2,(c.height-ch*scale)/2,cw*scale,ch*scale);document.getElementById('frame-'+a.id).textContent='目前影格 '+(frame+1)+' / '+a.count;}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
