<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星環專屬外觀 · 預覽</title><link rel="stylesheet" href="/star-ring-cosmetics.css?v=20261018-rotation2"><style>body{margin:0;background:#081321;color:#e5d2ac;font-family:Georgia,'Noto Serif TC',serif;padding:14px}main{max-width:840px;margin:auto}.preview-caption{font-size:11px;line-height:1.8;color:#acbac9}nav{display:flex;gap:10px;margin:12px 0}nav button{background:#182a40;color:#d9c18d;padding:10px;border:1px solid #bca36c66;min-height:44px}</style><script src="/star-ring-cosmetics.js?v=20261025-wardrobe1"></script></head><body><main><p class="preview-caption">星環衣櫥 · 獨立示意預覽<br>使用測試角色與示意徽記，不讀取玩家資料、不扣除任何實際資源。</p><nav><button data-reset>重置示意進度</button><button data-hero="mage">法師</button><button data-hero="sword">劍士</button><button data-hero="archer">妖精</button></nav><div id="wardrobe"></div></main><script>
const catalog=[['dawn','曙星之環',60,'日光化成薄金星環，陪伴每一次啟程。'],['moon','月潮星紋',120,'月銀與靛藍交錯，如潮汐繞過足下。'],['eclipse','星蝕王冠',180,'紫晶與黯金相映，為邊境歸來者加冕。']].map(([key,name,cost,description])=>({id:'star_ring_aura_'+key,name,cost,description,level:40}));let owned=[],equipped=null,balance=360,hero='mage',stop;
const actors={mage:'/art/mage-zero-clean-20261010/hero_mage_f.png',sword:'/art/sword-zero-clean-20261011/hero_sword_f.png',archer:'/art/elf-v2-20261010/hero_archer_f.webp'};
const state=()=>({ok:true,catalog,owned:[...owned],equipped:catalog.find(a=>a.id===equipped)||null,balance});function mount(){stop?.();stop=RpgStarRingCosmetics.mount(document.querySelector('#wardrobe'),{me:()=>({character:{tgId:'preview-cosmetics-only',level:80,name:'星環旅人'}}),actorArt:()=>actors[hero],api:async(path,body)=>{if(path==='star-ring/shop'){const aura=catalog.find(a=>a.id===body.offerId);if(!aura||owned.includes(aura.id)||balance<aura.cost)return {ok:false,message:'此為示意預覽，請先重置進度。'};owned.push(aura.id);balance-=aura.cost;return {ok:true,cosmetics:state()};}if(path==='star-ring/cosmetics/equip'){equipped=body.cosmeticId;return state();}return state();}});}document.querySelector('[data-reset]').onclick=()=>{owned=[];equipped=null;balance=360;mount();};document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{hero=b.dataset.hero;mount();});mount();
</script></body></html>
