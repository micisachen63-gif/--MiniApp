<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妖精三轉・華麗魔法模組</title><style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft JhengHei',sans-serif;background:#0b1320;color:#edf0f7}*{box-sizing:border-box}body{margin:0;padding:30px;max-width:1500px;margin:auto}h1{font-size:30px;margin:0 0 8px;color:#ecdcac}p{color:#aab8c9;margin:0 0 22px}.layout{display:grid;grid-template-columns:minmax(340px,1fr) minmax(360px,1fr);gap:24px}.viewer{position:sticky;top:20px;align-self:start;border:1px solid #536476;border-radius:16px;overflow:hidden;background:#121c2d}.stage{position:relative;aspect-ratio:1;background:#121c2d}canvas{display:block;width:100%;height:100%}.controls{padding:17px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;border-top:1px solid #364453}button,select,a{font:inherit;border-radius:7px;border:1px solid #546379;background:#19273a;color:#f1e8ce;padding:8px 12px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2b3d53}button:disabled{opacity:.45;cursor:default}#caption{width:100%;font-weight:650;color:#f5e3ad}#status{font-size:13px;color:#aab8c9}input{width:100%;accent-color:#dbbd72}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:0;overflow:hidden;text-align:center;background:#121c2d;border-radius:12px}.card.selected{border-color:#e6c57b;box-shadow:0 0 0 1px #e6c57b}.card img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.card b{display:block;font-size:13px;margin:10px 4px 4px}.card small{display:block;font-size:11px;color:#a2b1c5;margin:0 4px 10px}@media(max-width:850px){body{padding:16px}.layout{grid-template-columns:1fr}.viewer{position:static}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:25px}}@media(max-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.controls{padding:12px}}
</style></head><body><h1>妖精三轉・華麗魔法模組</h1><p>延續原畫風，檢視獨立影格、魔法特效與透明邊緣。</p><div class="layout"><div class="viewer"><div class="stage" id="stage"><canvas id="canvas" width="1792" height="1792"></canvas></div><div class="controls"><div id="caption"></div><button id="play">播放</button><button id="prev">上一格</button><button id="next">下一格</button><select id="background"><option value="#121c2d">深色背景</option><option value="#f1f4f5">淺色背景</option><option value="#97065b">洋紅背景</option><option value="checker">透明格</option></select><a id="original" target="_blank">透明原畫</a><input type="range" id="frame" min="0" max="7" value="0"><span id="status"></span></div></div><div class="grid" id="grid"></div></div><script>
const names={A11:'星風聖射',A12:'蒼穹裁決者',A21:'暴風先知',A22:'天羽御風者',B11:'萬獸祭司',B12:'古森召靈師',B21:'皎月巡狩',B22:'荊棘影衛'},keys=Object.keys(names).flatMap(p=>['f','m'].map(g=>p+'_'+g));let chosen='A11_f',sheet=null,master=null,cell=1792,frame=0,playing=false,start=0,loadRun=0,state={};const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d',{alpha:true}),cards=new Map();
for(const key of keys){const card=document.createElement('button');card.className='card';card.innerHTML='<img loading="lazy" src="art/elf-adv3-magic-20261013/hero_adv3_archer_'+key+'.webp"><b>'+names[key.slice(0,3)]+'・'+(key.endsWith('_f')?'女':'男')+'</b><small>原畫已生成</small>';card.addEventListener('click',()=>select(key));cards.set(key,card);$('grid').append(card);}
function draw(){ctx.clearRect(0,0,cell,cell);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(sheet)ctx.drawImage(sheet,frame%4*cell,Math.floor(frame/4)*cell,cell,cell,0,0,cell,cell);else if(master){const scale=Math.min(cell*.90/master.naturalWidth,cell*.90/master.naturalHeight);const w=master.naturalWidth*scale,h=master.naturalHeight*scale;ctx.drawImage(master,(cell-w)/2,(cell-h)/2,w,h);} $('frame').value=frame;$('status').textContent=sheet?'影格 '+(frame+1)+' / 8 · '+sheet.naturalWidth+' × '+sheet.naturalHeight+' · 無損 WebP':'原畫檢視 · 動作組裝中';}
function stop(){playing=false;$('play').textContent='播放';}
async function select(key){stop();chosen=key;frame=0;sheet=null;master=null;const run=++loadRun;cards.forEach((c,k)=>c.classList.toggle('selected',k===key));$('caption').textContent=names[key.slice(0,3)]+'・'+(key.endsWith('_f')?'女':'男');$('original').href='art/elf-adv3-magic-20261013/hero_adv3_archer_'+key+'.webp';$('play').disabled=true;const first=new Image();first.onload=()=>{if(run!==loadRun)return;master=first;draw();};first.src='art/elf-adv3-magic-20261013/hero_adv3_archer_'+key+'.webp';if(state[key]?.ready){const img=new Image();img.onload=()=>{if(run!==loadRun)return;sheet=img;cell=img.naturalWidth/4;$('canvas').width=$('canvas').height=cell;$('play').disabled=false;draw();};img.src='art/elf-adv3-magic-20261013/hero_adv3_archer_'+key+'_attack.webp?v='+state[key].mtime;}draw();}
function tick(t){if(!playing)return;if(!start)start=t;frame=Math.min(7,Math.floor(((t-start)%2000)/250));draw();requestAnimationFrame(tick);}
$('play').onclick=()=>{if(playing)stop();else if(sheet){playing=true;start=0;$('play').textContent='暫停';requestAnimationFrame(tick);}};$('prev').onclick=()=>{stop();frame=(frame+7)%8;draw();};$('next').onclick=()=>{stop();frame=(frame+1)%8;draw();};$('frame').oninput=e=>{stop();frame=+e.target.value;draw();};$('background').onchange=e=>{$('stage').style.background=e.target.value==='checker'?'conic-gradient(#d9dee4 25%,#f7f8fa 0 50%,#d9dee4 0 75%,#f7f8fa 0) 0 0/28px 28px':e.target.value;};
async function refresh(){try{const r=await fetch('art/elf-adv3-magic-20261013/gallery.json',{cache:'no-store'});state=await r.json();for(const[key,v]of Object.entries(state))cards.get(key).querySelector('small').textContent=v.ready?'八格動畫已組裝':v.frames+' / 7 原生影格';}catch{}}refresh().then(()=>select(chosen));
</script></body></html>
