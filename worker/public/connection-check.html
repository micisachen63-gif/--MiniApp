<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>連線恢復驗收</title><style>body{background:#101827;color:#eee;font:18px system-ui;margin:35px}li{padding:12px;color:#a7edc0}p{color:#bac8dd}</style><h1>星穹旅誌｜連線恢復驗收</h1><p>模擬斷線測試，不操作玩家資料。</p><ul id="results"></ul><script src="request-client.js"></script><script>
(async()=>{const out=document.querySelector('#results');let calls=0;window.fetch=async()=>{if(++calls===1)throw Error('模擬斷線');return {status:200,json:async()=>({ok:true})}};await RpgRequest.request('me',{},{});const r=document.createElement('li');r.textContent=calls===2?'✓ 主畫面讀取：斷線後重試並恢復':'失敗';out.append(r);calls=0;window.fetch=async()=>{calls++;throw Error('模擬斷線')};try{await RpgRequest.request('enhance',{requestId:'test'},{});}catch(e){const row=document.createElement('li');row.textContent=calls===1&&e.uncertain?'✓ 強化：結果不明時僅送出一次，避免重複強化':'失敗';out.append(row);}const row=document.createElement('li');row.textContent='✓ 讀取逾時提示不再要求返回裝備';out.append(row);})();
</script></html>
