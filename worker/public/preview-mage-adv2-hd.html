<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法師二轉・角色與動畫驗收</title><link rel="stylesheet" href="battle.css"><style>body{margin:0;padding:20px;background:#101b2b;color:#eadabb;font:16px system-ui}h1{font-size:26px}h2{font-size:18px}p{color:#b6c5d6;line-height:1.6}button,select,input{font:inherit;padding:8px;margin:4px}a{color:#e9cd96}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}article{background:#1a2b40;border:1px solid #566279;border-radius:12px;padding:12px}canvas.pose{width:100%;background:radial-gradient(ellipse at 50% 80%,#344958,#18283b 70%)}#battle{max-width:800px;margin:auto}.bstage{width:100%;max-width:800px}.guide{height:1px;background:#9bccac}details{margin-top:20px}.portrait{width:100%;max-height:75vh;object-fit:contain}@media(max-width:800px){main{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<h1>法師二轉・角色與動畫驗收</h1><p>大魔導士、冰霜術士、時空術士、召喚師 · 男女八套 · 每套 12 格 · 透明背景<br>人物本體高度與腳底基線統一，保留各職業的武器與服裝輪廓。</p>
<div><button id="play">暫停</button><label>影格 <input id="frame" type="range" min="0" max="11" value="0"><span id="number">1 / 12</span></label></div>
<main></main><h2>實際戰鬥元件・站位對照</h2><p>選擇角色可檢閱正式遊戲使用的戰鬥元件。此頁只預覽角色，不操作玩家資料。</p><select id="selection"></select><button id="cast">施法動作</button><div id="battle"></div>
<details><summary>高細節立繪</summary><img id="portrait" class="portrait" alt="角色立繪"></details>
<script src="battle.js"></script><script>
let current=0,playing=true,last=0;const entries=[];let manifest,battle;
const ready=fetch('art/mage-adv2-hd-20261012/manifest.json').then(r=>r.json()).then(async m=>{manifest=m;await Promise.all(Object.entries(m).map(([key,spec])=>new Promise((resolve,reject)=>{const article=document.createElement('article');article.innerHTML='<h2>'+spec.name+'</h2><canvas class="pose" width="512" height="512"></canvas><a href="art/mage-adv2-hd-20261012/hero_'+key+'_portrait.png" target="_blank">高細節立繪</a>';document.querySelector('main').append(article);const image=new Image;image.onload=()=>{entries.push({key,image,ctx:article.querySelector('canvas').getContext('2d')});resolve()};image.onerror=reject;image.src='art/mage-adv2-hd-20261012/hero_'+key+'_attack.webp';const opt=document.createElement('option');opt.value=key;opt.textContent=spec.name;document.querySelector('#selection').append(opt);})));battle=RpgBattle.create({fmt:String,heroKey:c=>'adv2_mage_'+c.classPath+'_'+c.gender,src:(kind,key)=>kind==='hero'?'art/mage-adv2-hd-20261012/hero_'+key+'.png':kind==='map'?'art/v2/bg_myth01.webp':'',heroMeta:key=>({fig:m[key].fig}),heroAnim:key=>({...m[key],src:'art/mage-adv2-hd-20261012/hero_'+key+'_attack.webp'}),stateInfo:()=>({text:'尺寸與站位預覽',cls:''})});document.querySelector('#battle').append(battle.el);select(document.querySelector('#selection').value);render(0);});
function select(key){document.querySelector('#selection').value=key;const [_,path,gender]=key.match(/adv2_mage_(.+)_([fm])/);battle.sync({character:{id:'preview',tgId:'preview-mage2',revision:1,baseClass:'mage',classPath:path,gender,state:'town_no_red',level:60,mapId:1,mapName:'預覽',hp:100,maxHp:100,mp:100,maxMp:100},battle:{monsters:[],skill:{name:{A1:'隕石術',A2:'暴風雪',B1:'時間扭曲',B2:'召喚火精靈'}[path],cost:10}}});document.querySelector('#portrait').src='art/mage-adv2-hd-20261012/hero_'+key+'_portrait.png';}
function render(frame){current=frame;document.querySelector('#frame').value=frame;document.querySelector('#number').textContent=(frame+1)+' / 12';for(const e of entries){e.ctx.clearRect(0,0,512,512);e.ctx.drawImage(e.image,frame%4*512,Math.floor(frame/4)*512,512,512,0,0,512,512)}if(battle?.state.heroSheet?.ready){const s=battle.state.heroSheet;battle.el.querySelector('.hero-sheet').style.backgroundPosition=frame%4/3*100+'% '+Math.floor(frame/4)/2*100+'%';}}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暫停':'播放';};document.querySelector('#frame').oninput=e=>{playing=false;document.querySelector('#play').textContent='播放';render(+e.target.value)};document.querySelector('#selection').onchange=e=>select(e.target.value);document.querySelector('#cast').onclick=()=>{playing=true;current=0;document.querySelector('#play').textContent='暫停';setTimeout(()=>{playing=false;render(0);document.querySelector('#play').textContent='播放'},12*100);};
window.magePreview={ready,render,select,pause:()=>{playing=false;},get battle(){return battle},get entries(){return entries},get manifest(){return manifest}};ready.then(()=>{requestAnimationFrame(function tick(t){if(playing&&t-last>100){render((current+1)%12);last=t}requestAnimationFrame(tick)})});
</script></html>
