<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星征裝備 · 星穹旅誌</title><link rel="stylesheet" href="/game-brand.css"><style>body{margin:0;background:#0b1525;color:#ead9b5;font-family:"Microsoft JhengHei",serif}main{max-width:1200px;margin:auto;padding:28px 18px}h1{color:#f3d694}p{color:#b8c5d4;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.item{margin:0;padding:12px;border:1px solid #867346;background:linear-gradient(140deg,#1f3045,#101b2c);border-radius:5px;text-align:center}.item img{width:100%;aspect-ratio:1;object-fit:contain}.item b{display:block;margin:10px 0}a{color:#f0d18e}</style></head><body><main><small>CELESTIAL EXPEDITION COLLECTION</small><h1>星征裝備</h1><p>四職業防具、十二種武器與四種共用裝備，各有自己的星環造型。各階級沿用此系列造型，實際 T 階、品質與強化以遊戲標示為準。</p><section class="grid" id="items" aria-label="星征裝備圖鑑"></section></main><script type="module">const c=await(await fetch('/art/star-ring-gear-20261020/catalog.json')).json(),root=document.querySelector('#items');for(const e of c.items){const card=document.createElement('figure');card.className='item';const image=document.createElement('img');image.src=e.icon;image.alt=e.name;const name=document.createElement('b');name.textContent=e.name;const a=document.createElement('a');a.href=e.photo;a.textContent='查看 TG 分享圖';a.target='_blank';a.rel='noopener';card.append(image,name,a);root.append(card);}</script></body></html>
