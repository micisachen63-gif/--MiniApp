<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>星環環身特效 · 造型預覽</title><link rel="stylesheet" href="/hero-size.css?v=20261018-all-portraits-clean1"><link rel="stylesheet" href="/star-ring-cosmetics.css?v=20261026-perimeter1">
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#081321;color:#e6d7b5;font:14px Georgia,'Noto Serif TC',serif}main{max-width:1120px;margin:auto}header small{color:#bc9c63;letter-spacing:.2em;font-size:10px}h1{font-size:28px;font-weight:400;margin:12px 0}p{font-size:12px;color:#a4b4c3;line-height:1.9}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,select{font:inherit;min-height:44px;padding:10px 15px;background:#142235;border:1px solid #bba16a55;color:#e5cfa1;border-radius:4px}button[aria-pressed=true]{border-color:#e4c581;background:#3b3540}label{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:12px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{border:1px solid #aa8d5744;padding:8px;background:linear-gradient(#1b2b40,#0c1727);border-radius:8px;min-width:0}.fig{position:relative;width:100%;height:390px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#25344a99,transparent 70%);border:1px solid #c4a76e22;border-radius:5px}.fig>img{height:100%;width:100%;object-fit:contain;object-position:center bottom;position:relative;z-index:1}article h2{font-size:15px;font-weight:400;margin:12px 8px 6px}article small{display:block;color:#9bafc2;font-size:10px;margin:0 8px 10px}@media(max-width:700px){body{padding:16px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fig{height:290px}label{margin-left:0;width:100%}h1{font-size:24px}}
</style></head><body><main><header><small>CELESTIAL PRESENCE</small><h1>星光，與你同行</h1><p>三款環身特效 · 男女與各階轉職造型預覽<br>此頁只展示美術與動畫，不連線玩家資料，也不會扣除資源。</p></header><nav><button data-tone="dawn" aria-pressed="true">曙星之環</button><button data-tone="moon" aria-pressed="false">月潮星紋</button><button data-tone="eclipse" aria-pressed="false">星蝕王冠</button><button data-gender="m">切換男女</button><label>轉職路線 <select id="path"><option value="">初始職業</option></select></label></nav><section class="gallery" aria-label="角色與環身特效"></section></main>
<script src="/hero-art-registry.js"></script><script src="/star-ring-cosmetics.js?v=20261026-perimeter1"></script><script src="/hero-size.js?v=20261018-all-portraits-clean1"></script><script>
(()=>{let tone='dawn',gender='m',cleanup=()=>{};const reg=window.RpgHeroArtRegistry,select=document.querySelector('#path');const paths=[...new Set(reg.keys.map(k=>reg.get(k).classPath).filter(Boolean))].sort((a,b)=>a.length-b.length||a.localeCompare(b));for(const p of paths){const o=document.createElement('option');o.value=p;o.textContent=p.length+' 轉 · '+p;select.append(o);}select.value='A11';
 function paint(){cleanup();document.querySelectorAll('[data-tone]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tone===tone)));const cards=['sword','archer','mage','thief'].map((base,i)=>{const g=i%2?(gender==='m'?'f':'m'):gender,key=reg.key({baseClass:base,classPath:select.value,gender:g}),h=reg.get(key);return '<article class="hall-loadout"><div class="fig" data-member-id="'+key+'"><img src="/'+h.portrait+'" alt="'+h.name+'"></div><h2>'+h.name+'</h2><small>'+key+'</small></article>';});const gallery=document.querySelector('.gallery');gallery.innerHTML=cards.join('');cleanup=RpgStarRingCosmetics.mountActors(gallery,[...gallery.querySelectorAll('.fig')].map(n=>({id:n.dataset.memberId,aura:'star_ring_aura_'+tone})),'.fig');}
 document.querySelectorAll('[data-tone]').forEach(b=>b.onclick=()=>{tone=b.dataset.tone;paint();});document.querySelector('[data-gender]').onclick=()=>{gender=gender==='m'?'f':'m';paint();};select.onchange=paint;paint();})();
</script></body></html>
