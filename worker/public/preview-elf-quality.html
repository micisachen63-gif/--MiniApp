<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妖精一至三轉・品質整理</title><style>body{margin:0;padding:24px;background:#152331;color:#e9dbc2;font:16px system-ui}h1{font-size:25px}select,button,input{font:inherit;padding:8px;background:#283d50;color:#fff;border:1px solid #63798c;border-radius:8px;margin:4px}canvas{display:block;width:min(90vw,512px);background:#223040;border:1px solid #506777;border-radius:12px;margin-top:16px}p{max-width:700px;color:#bac8d2}</style><h1>妖精一至三轉・品質整理</h1><p>保留原角色與分支特色。狼、獵鷹、自然精靈召喚可逐格查看。</p><select id="choice"></select><button id="toggle">暫停</button><input id="frame" type="range" min="0" max="7" value="0"><span id="label"></span><canvas width="512" height="512"></canvas><script>const groups=[{"adv":1,"branch":"A","gender":"f","src":"art/elf-adv1-hd-20261011/hero_adv1_archer_A_f_attack.png"},{"adv":1,"branch":"A","gender":"m","src":"art/elf-adv1-hd-20261011/hero_adv1_archer_A_m_attack.png"},{"adv":1,"branch":"B","gender":"f","src":"art/elf-adv1-hd-20261011/hero_adv1_archer_B_f_attack.png"},{"adv":1,"branch":"B","gender":"m","src":"art/elf-adv1-hd-20261011/hero_adv1_archer_B_m_attack.png"},{"adv":2,"branch":"A1","gender":"f","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_A1_f_attack.png"},{"adv":2,"branch":"A1","gender":"m","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_A1_m_attack.png"},{"adv":2,"branch":"A2","gender":"f","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_A2_f_attack.png"},{"adv":2,"branch":"A2","gender":"m","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_A2_m_attack.png"},{"adv":2,"branch":"B1","gender":"f","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_B1_f_attack.png"},{"adv":2,"branch":"B1","gender":"m","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_B1_m_attack.png"},{"adv":2,"branch":"B2","gender":"f","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_B2_f_attack.png"},{"adv":2,"branch":"B2","gender":"m","src":"art/elf-adv2-hd-20261011/hero_adv2_archer_B2_m_attack.png"},{"adv":3,"branch":"A11","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A11_f_attack.png"},{"adv":3,"branch":"A11","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A11_m_attack.png"},{"adv":3,"branch":"A12","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A12_f_attack.png"},{"adv":3,"branch":"A12","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A12_m_attack.png"},{"adv":3,"branch":"A21","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A21_f_attack.png"},{"adv":3,"branch":"A21","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A21_m_attack.png"},{"adv":3,"branch":"A22","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A22_f_attack.png"},{"adv":3,"branch":"A22","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_A22_m_attack.png"},{"adv":3,"branch":"B11","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B11_f_attack.png"},{"adv":3,"branch":"B11","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B11_m_attack.png"},{"adv":3,"branch":"B12","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B12_f_attack.png"},{"adv":3,"branch":"B12","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B12_m_attack.png"},{"adv":3,"branch":"B21","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B21_f_attack.png"},{"adv":3,"branch":"B21","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B21_m_attack.png"},{"adv":3,"branch":"B22","gender":"f","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B22_f_attack.png"},{"adv":3,"branch":"B22","gender":"m","src":"art/elf-adv3-hd-20261011/hero_adv3_archer_B22_m_attack.png"}],select=document.querySelector('#choice'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');groups.forEach((g,i)=>select.add(new Option(g.adv+'轉 '+g.branch+' · '+(g.gender==='f'?'女':'男'),i)));select.value=22;let image,playing=true,start=performance.now(),current=0,run=0;const cache=new Map();async function choose(i){select.value=i;const n=++run,g=groups[i];if(!cache.has(g.src))cache.set(g.src,new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=g.src+'?v=elf-quality-1'}));const im=await cache.get(g.src);if(n!==run)return;image=im;start=performance.now();render(0)}function render(i){current=i;ctx.clearRect(0,0,512,512);if(image)ctx.drawImage(image,i%4*512,Math.floor(i/4)*512,512,512,0,0,512,512);document.querySelector('#frame').value=i;document.querySelector('#label').textContent='第 '+(i+1)+' / 8 格'}select.onchange=()=>choose(+select.value);document.querySelector('#frame').oninput=e=>{playing=false;document.querySelector('#toggle').textContent='播放';render(+e.target.value)};document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'暫停':'播放';start=performance.now()-current*250};window.elfPreview={groups,choose,render,pause:()=>playing=false};requestAnimationFrame(function tick(t){if(playing)render(Math.floor(((t-start)%2400)/300));requestAnimationFrame(tick)});choose(+select.value);</script></html>
