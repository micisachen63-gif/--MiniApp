<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星穹旅誌｜全地圖怪物驗收</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="battle.css"><style>body{margin:0;padding:16px;background:#101725;color:#f3e6ca;font:15px system-ui}main{max-width:1000px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}select,button{font:inherit;padding:10px;max-width:100%;background:#233346;color:#ffe0a0;border:1px solid #826e4b;border-radius:8px}#stage{max-width:800px;margin:auto}#metrics{white-space:pre-wrap;line-height:1.6}#atlas{width:100%;background:#1e3039}summary{padding:12px;cursor:pointer}.controls label{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}.controls select{min-width:0;width:230px;max-width:100%}.controls #map,.controls #count{width:auto}.bstage{margin-top:12px}</style></head><body><main><h1>全地圖怪物驗收</h1><p>隔離的美術驗收資料，使用正式戰鬥繪製程式與角色素材。示範回合不會操作玩家、取得獎勵或影響正式出怪池。</p><div class="controls"><label>地圖 <select id="map"></select></label><label>怪物 <select id="monster"></select></label><label>群體 <select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>角色 <select id="hero"><option value="sword_m">男劍士</option><option value="mage_f">女法師</option><option value="archer_f">女精靈</option></select></label><button id="round">播放真實 HP 範例回合</button><button id="magic">連播魔法特效</button><button id="reattach">暫離狩獵畫面</button></div><div id="stage"></div><p id="away" hidden>已暫離。按「返回狩獵畫面」檢查動畫恢復。</p><p id="metrics"></p><details><summary>逐格檢查圖集</summary><img id="atlas" alt="怪物動畫圖集"></details></main>
<script src="art.js"></script><script src="maps.js"></script><script src="skill-fx.js"></script><script src="cinematic-fx.js"></script><script src="hero-fx.js"></script>
<script src="hero-art-registry.js"></script><script src="hero-art-registry-fx.js"></script><script src="monster-expansion-catalog.js"></script>
<script type="module">
const q=new URLSearchParams(location.search),data=await fetch('monster-expansion-review-data.json').then(r=>r.json());
const mapId=Math.max(1,Math.min(12,Number(q.get('map'))||1)),items=data.items.filter(m=>m.map===mapId);if(!items.length){document.querySelector('#metrics').textContent='這張地圖還沒有完成重排的素材。';throw Error('no packed assets');}
// This explicit fixture override cannot modify the backend readiness module.
// Keep the production108 catalogue intact; legacy72 retain their5x2 rendering.
const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.append(s);});
await load('monster-expansion.js');await load('battle.js');
const registry=window.RpgHeroArtRegistry;
const heroRoutes=registry.keys.map(key=>({key,name:registry.get(key).name,src:registry.resolve(key,'hero'),meta:registry.get(key).heroMeta,animation:registry.animation(key)})),heroSelect=document.querySelector('#hero');heroSelect.replaceChildren();for(const hero of heroRoutes){const option=document.createElement('option');option.value=hero.key;option.textContent=`${(hero.name||({sword:'劍士',mage:'法師',archer:'精靈弓手'}[hero.key.includes('archer')?'archer':hero.key.includes('mage')?'mage':'sword'])).replace(/[・·]\s*[男女]$/,'')}・${hero.key.endsWith("_f")?"女":"男"} (${hero.key})`;heroSelect.append(option);}if(heroRoutes.some(x=>x.key===q.get('hero')))heroSelect.value=q.get('hero');const select=document.querySelector('#monster');
for(const m of items){const option=document.createElement('option');option.value=m.key;option.textContent=`${m.map} · ${m.name} · ${m.ready?'已收錄':'待驗收'}`;select.append(option);}
if(items.some(m=>m.key===q.get('key')))select.value=q.get('key');document.querySelector('#count').value=q.get('count')||'1';
let battle,me,serial=0,timer,magicTimer,activeHero,activeMap;
function build(){
 clearInterval(timer);clearInterval(magicTimer);const m=items.find(x=>x.key===select.value),hero=document.querySelector('#hero').value,count=Number(document.querySelector('#count').value),mapItems=items.filter(x=>x.map===m.map);const enemies=Array.from({length:count},(_,i)=>{const descriptor=i?mapItems[i%mapItems.length]:m;return {id:`fixture:${++serial}:${i}`,name:descriptor.name,mapId:m.map,elite:descriptor.role!=='normal',spriteKey:descriptor.key,hp:120,maxHp:120,spell:descriptor.spell};});
 const heroSpec=heroRoutes.find(x=>x.key===hero);activeHero=heroSpec;activeMap=m.map;const src=(kind,value)=>{if(kind==='hero')return activeHero.src;if(kind==='map')return `art/v2/bg_myth${String(activeMap).padStart(2,'0')}.webp`;const meta=items.find(m=>m.key===value||m.name===value);return meta?(kind.endsWith('Anim')?meta.sheet:meta.src):null;};
 if(!battle)battle=RpgBattle.create({groupSize:count,src,fmt:String,items:{},stateInfo:()=>({text:'隔離美術驗收',cls:''}),heroKey:()=>activeHero.key,heroMeta:()=>activeHero.meta,heroAnim:()=>activeHero.animation});battle.attach(document.querySelector('#stage'));
 me={character:{tgId:'isolated-monster-qa',revision:1,baseClass:hero.includes('mage')?'mage':hero.includes('archer')?'archer':'sword',gender:hero.slice(-1),classPath:hero.match(/^adv\d_\w+_([AB][12]*)_[fm]$/)?.[1]||'',mapId:m.map,level:Math.max(1,m.map*10-5),mapName:'驗收地圖',state:'fighting',hp:100,maxHp:100,mp:50,maxMp:50},battle:{atk:40,crit:0,skill:{mult:1.5,name:'魔法攻擊',cost:0,targets:4},monsters:enemies.map(e=>e.name),elite:m.name,idleCombat:{enemies,round:null}},collection:{unlocked:[]}};battle.sync(me);document.querySelector('#atlas').src=src('monsterAnim',m.key);
 timer=setInterval(()=>{const root=battle.el,h=root.querySelector('.hero'),heroHeight=Number(h.dataset.figureHeight),mons=battle.state.group;document.querySelector('#metrics').textContent=`${m.name} · ${m.ready?'素材已收錄，場景待驗收':'尚未驗收'}\n人物可見高 ${heroHeight.toFixed(1)}px\n`+mons.map(e=>`${e.refs.mName.textContent}：可見高 ${Number(e.refs.mon.dataset.figureHeight).toFixed(1)}px／人物 ${(Number(e.refs.mon.dataset.figureHeight)/heroHeight).toFixed(2)} 倍，HP ${e.refs.mHpText.textContent}`).join('\n');},700);
}
document.querySelector('#round').onclick=()=>{const before=me.battle.idleCombat.enemies.map(e=>({...e})),events=[];for(const e of before){events.push({type:'hit',targetId:e.id,enemy:{...e},afterHp:80,damage:40,skill:true,skillName:'魔法攻擊'});events.push({type:'hit',targetId:e.id,enemy:{...e,hp:80},afterHp:0,damage:80,skill:false});}const after=before.map((e,i)=>({...e,id:`fixture:${++serial}:${i}`,hp:120}));const round={id:`qa:${++serial}`,mapId:me.character.mapId,before,after,events,presentation:{monsterActions:[{sourceId:before[0].id,spell:before[0].spell,action:'cast',attackDirection:-1,cosmetic:true}]}};me.battle.idleCombat={enemies:after,round};battle.sync(me,{ticks:1,combat:round,kills:before.length,exp_gained:0,gold_gained:0,drops:{},from_at:serial*60000,to_at:(serial+1)*60000});};
document.querySelector('#magic').onclick=()=>{clearInterval(magicTimer);let remaining=4;const cast=()=>{const enemies=me.battle.idleCombat.enemies.map(e=>({...e}));const round={id:`qa:magic:${++serial}`,mapId:me.character.mapId,before:enemies,after:enemies,events:[],presentation:{monsterActions:[{sourceId:enemies[0].id,spell:enemies[0].spell,action:'cast',attackDirection:-1,cosmetic:true}]}};me.battle.idleCombat={enemies,round};battle.sync(me,{ticks:1,combat:round,kills:0,exp_gained:0,gold_gained:0,drops:{},from_at:serial*60000,to_at:(serial+1)*60000});if(--remaining<=0)clearInterval(magicTimer);};cast();magicTimer=setInterval(cast,6000);};
const mapSelect=document.querySelector('#map');for(let id=1;id<=12;id++){const option=document.createElement('option');option.value=id;option.textContent=`地圖 ${id}`;mapSelect.append(option);}mapSelect.value=q.get('map')||String(items[0].map);mapSelect.onchange=()=>{const next=new URL(location.href);next.searchParams.set('map',mapSelect.value);next.searchParams.set('hero',heroSelect.value);next.searchParams.set('count',document.querySelector('#count').value);next.searchParams.delete('key');location.href=next.href;};
document.querySelector('#reattach').onclick=()=>{const button=document.querySelector('#reattach'),away=document.querySelector('#away');if(battle.el.isConnected){clearInterval(magicTimer);battle.el.remove();away.hidden=false;button.textContent='返回狩獵畫面';}else{battle.attach(document.querySelector('#stage'));away.hidden=true;button.textContent='暫離狩獵畫面';}};
for(const el of [select,document.querySelector('#count'),document.querySelector('#hero')])el.onchange=build;build();
</script></body></html>
