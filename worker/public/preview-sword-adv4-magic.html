<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>劍士四轉・魔法角色與獨立攻擊素材</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#edf1f5;font:16px system-ui;padding:22px}h1{font-size:25px;margin:0 0 9px}p{color:#aebfd0;max-width:900px;line-height:1.7}select,button{padding:10px;background:#233147;color:white;border:1px solid #5b7088;border-radius:7px;font:inherit;margin:4px}label{display:inline-block;margin:10px}canvas{display:block;width:100%;max-width:1000px;border:1px solid #637084;border-radius:14px;background:radial-gradient(ellipse at 50% 65%,#293b51,#101a2a 75%)}.layout{display:grid;grid-template-columns:minmax(0,1000px) 230px;gap:18px}.portrait{width:100%;height:350px;object-fit:contain;background:#192438;border-radius:12px}.frames{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:1000px}.frames button{font-size:12px;margin:5px 0}.frames .active{border-color:#ffc46e;background:#405674}#info{font-size:13px;line-height:1.7;white-space:pre-wrap}input[type=range]{width:min(100%,650px)}@media(max-width:800px){.layout{grid-template-columns:1fr}.portrait{height:240px}.frames{grid-template-columns:repeat(4,1fr)}}
</style><h1>劍士四轉・神域魔法模組</h1><p>十六職業、男女角色。角色影格與對應攻擊特效分開保存；逐格替換畫面，保留原生透明像素與細節。</p>
<select id="branch"></select><select id="gender"><option value="f">女角色</option><option value="m">男角色</option></select><button id="play">暫停</button><select id="speed"><option value="2000">正常速度</option><option value="4000">慢速檢查</option><option value="1200">快速檢查</option></select>
<label><input id="hero" type="checkbox" checked>角色影格</label><label><input id="fx" type="checkbox" checked>獨立攻擊特效</label><label><input id="light" type="checkbox">亮背景</label>
<div class="layout"><div><canvas width="1000" height="650"></canvas><input id="progress" type="range" min="0" max="7" value="0"><div class="frames"></div></div><aside><img id="portrait" class="portrait" alt="原生角色待機影格"><p id="info">讀取素材…</p></aside></div>
<script>
const q=s=>document.querySelector(s),canvas=q('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),images=new Map();let manifest,effects,plan,active,hero,fx,playing=true,started=performance.now(),current=0,run=0;
async function img(src){if(!images.has(src)){const im=new Image();im.src=src;images.set(src,im)}const im=images.get(src);await im.decode();return im}
async function select(code=q('#branch').value,gender=q('#gender').value){const token=++run,key='adv4_sword_'+code+'_'+gender;q('#branch').value=code;q('#gender').value=gender;active=manifest[key];if(!active){q('#info').textContent='素材製作中';return}const pair=await Promise.all([img('art/sword-adv4-magic-20261013/hero_'+key+'_attack.webp'),img('art/sword-adv4-magic-20261013/fx/fx_sword_adv4_'+code+'.webp')]);if(token!==run)return;[hero,fx]=pair;q('#portrait').src='art/sword-adv4-magic-20261013/hero_'+key+'.png';q('#info').textContent=active.name+' · '+(gender==='f'?'女':'男')+'\n角色原生 '+active.nativeWidth+' × '+active.nativeHeight+'\n角色影格 '+active.cellWidth+' × '+active.cellHeight+' px\n獨立特效影格 '+effects[code].cellWidth+' × '+effects[code].cellHeight+' px\n8 格 · 4 × 2\n真透明 RGBA · 無損 WebP\n原畫像素不放大';started=performance.now();render(0);}
function drawCell(im,frame,x,y,h){const cw=im.naturalWidth/4,ch=im.naturalHeight/2,w=h*cw/ch;ctx.drawImage(im,frame%4*cw,Math.floor(frame/4)*ch,cw,ch,x-w/2,y-h,w,h);}
function render(frame){if(!hero||!fx)return;current=frame;ctx.clearRect(0,0,canvas.width,canvas.height);canvas.style.background=q('#light').checked?'#eef1f6':'';if(q('#hero').checked)drawCell(hero,frame,330,620,590);if(q('#fx').checked)drawCell(fx,frame,q('#hero').checked?725:500,530,q('#hero').checked?380:570);q('#progress').value=frame;q('.frames').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===frame));}
function pause(){playing=false;q('#play').textContent='播放';}
q('#play').onclick=()=>{playing=!playing;started=performance.now();q('#play').textContent=playing?'暫停':'播放';};for(const id of ['branch','gender'])q('#'+id).onchange=()=>select();q('#progress').oninput=e=>{pause();render(+e.target.value)};for(const id of ['hero','fx','light'])q('#'+id).onchange=()=>render(current);
(async()=>{[plan,manifest,effects]=await Promise.all(['art/sword-adv4-magic-20261013/generation-plan.json','art/sword-adv4-magic-20261013/manifest.json','art/sword-adv4-magic-20261013/fx/manifest.json'].map(p=>fetch(p).then(r=>r.json())));q('#branch').innerHTML=plan.effects.map(e=>'<option value="'+e.code+'">'+e.name+' · '+e.code+'</option>').join('');q('.frames').innerHTML=Array.from({length:8},(_,i)=>'<button>'+String(i+1).padStart(2,'0')+' 格</button>').join('');q('.frames').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{pause();render(i)});await select(Object.values(manifest)[0]?.code||'A111');})();
requestAnimationFrame(function tick(t){if(playing&&hero){const p=((t-started)%(+q('#speed').value+550))/+q('#speed').value;render(p>=1?0:Math.min(7,Math.floor(p*8)));}requestAnimationFrame(tick)});
window.sword4Preview={select,render,pause,get manifest(){return manifest},get effects(){return effects},get frame(){return current}};
</script></html>
