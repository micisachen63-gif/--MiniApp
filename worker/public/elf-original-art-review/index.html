<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全新原創妖精男女攻擊動畫審查</title><style>body{background:#0e1d25;color:#f0f5ed;font:16px system-ui,'Microsoft JhengHei',sans-serif;text-align:center;margin:0;padding:18px}h1{font-size:24px}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}.card{width:min(92vw,450px);padding:14px;background:#19313b;border:1px solid #577d7f;border-radius:16px}canvas{width:100%;height:auto;background:radial-gradient(#365963,#172c35);border-radius:10px}button{padding:10px 18px;background:#2d8a74;color:#fff;border:0;border-radius:9px}p{color:#b6d0d0;line-height:1.6}input{vertical-align:middle}</style><h1>全新 AI 原創妖精攻擊動畫審查</h1><p>男女圖皆為本次重新生成的原創素材。以 4×2 八格逐格播放供審查；尚未取代正式戰鬥角色。</p><button id="toggle">暫停</button>　<button id="restart">重播</button>　速度 <input id="fps" type="range" min="2" max="15" value="7"><span id="rate">7</span> FPS<div class="grid"><section class="card"><h2>女妖精｜新原創</h2><canvas id="female" width="450" height="450"></canvas><p id="label-female"></p><a href="female-attack.png" style="color:#b3f9d6">檢視女妖精原始圖</a></section><section class="card"><h2>男妖精｜新原創</h2><canvas id="male" width="450" height="450"></canvas><p id="label-male"></p><a href="male-attack.png" style="color:#b3f9d6">檢視男妖精原始圖</a></section></div><p>圖片原始尺寸：1774×887；實際格線與動作一致性仍需人工審查。</p><script>const a=['female','male'].map(id=>({id,img:new Image(),canvas:document.getElementById(id)}));for(const x of a)x.img.src=x.id+'-attack.png';let play=true,t=0,last=0,fps=7;document.getElementById('toggle').onclick=()=>{play=!play;document.getElementById('toggle').textContent=play?'暫停':'播放'};document.getElementById('restart').onclick=()=>t=0;document.getElementById('fps').oninput=e=>{fps=+e.target.value;document.getElementById('rate').textContent=fps};function render(now){if(last&&play)t+=(now-last)/1000;last=now;const frame=Math.floor(t*fps)%8;for(const x of a){const c=x.canvas,ctx=c.getContext('2d'),im=x.img;ctx.clearRect(0,0,c.width,c.height);if(im.complete&&im.naturalWidth){const cw=im.naturalWidth/4,ch=im.naturalHeight/2;ctx.drawImage(im,(frame%4)*cw,Math.floor(frame/4)*ch,cw,ch,8,8,434,434)}document.getElementById('label-'+x.id).textContent='影格 '+(frame+1)+' / 8'}requestAnimationFrame(render)}requestAnimationFrame(render)</script></html>
