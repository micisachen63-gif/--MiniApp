<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小精靈・華麗角色攻擊特效</title><style>body{margin:0;background:#0e1927;color:#ead5ac;font:16px system-ui;padding:24px}h1{font-size:26px}p{color:#aebed0}select,button,input{font:inherit;padding:10px;background:#20354b;color:#f3e7ce;border:1px solid #51657d;border-radius:8px;margin:5px}canvas{display:block;width:min(100%,1000px);border:1px solid #41566d;border-radius:16px;background:radial-gradient(ellipse at 60% 65%,#243b51,#111e30 70%);margin-top:20px}#detail{max-width:900px}a{color:#efd19c}</style>
<h1>小精靈・華麗角色攻擊特效</h1><p>全新 48 個職業材質 · 多層斬光、疾風箭流、靈獸召喚、元素爆發</p><select id="skill"></select><select id="gender"><option value="f">女角色</option><option value="m">男角色</option></select><select id="attack"><option value="skill">技能攻擊</option><option value="basic">普通攻擊</option></select><button id="play">暫停</button><label>動作進度 <input id="progress" type="range" min="0" max="100" value="0"></label><p id="detail"></p><canvas width="1000" height="500"></canvas>
<script src="skill-fx.js?v=20261011-skill-fx-1"></script><script src="cinematic-fx.js?v=20261011-cinematic-2"></script><script src="hero-lavish-fx.js?v=20261012-bold-2"></script><script>
const groups=[['sword','','強力斬'],['sword','A','旋風斬'],['sword','B','盾擊'],['sword','A1','血之狂怒'],['sword','A2','一閃'],['sword','B1','神聖制裁'],['sword','B2','不動如山'],['archer','','二連射'],['archer','A','箭雨'],['archer','B','獵鷹助攻'],['archer','A1','穿透狙擊'],['archer','A2','疾風連射'],['archer','B1','野獸之王'],['archer','B2','爆裂陷阱'],['mage','','火球術'],['mage','A','連鎖閃電'],['mage','B','奧術飛彈'],['mage','A1','隕石術'],['mage','A2','暴風雪'],['mage','B1','時間扭曲'],['mage','B2','召喚火精靈'],['archer','B12','古森召靈師・秘技']];
const desc={slash:'金色重斬弧光',whirlwind:'三層旋轉刀風',rage:'血紅雙重斬擊',shield:'冰藍盾形衝擊',guard:'守護盾與防禦符文',holy:'神聖金色光柱',flash:'白銀瞬斬',double:'翠綠雙箭',rain:'風系箭雨',falcon:'獵鷹俯衝與金色弩矢',snipe:'貫穿目標的風系狙擊',volley:'多段疾風連射',beasts:'獵鷹與狼群協同',trap:'地面機關印記與爆破',fire:'火球與火焰爆發',lightning:'分叉連鎖雷電',missiles:'三枚紫色奧術飛彈',meteor:'從天空墜落的熾熱隕石',blizzard:'冰晶暴風雪',time:'逆轉時鐘與時空符文',summon:'火精靈召喚陣與火焰使魔'};
const sel=document.querySelector('#skill');groups.forEach(([c,p,n],i)=>sel.add(new Option(`${{sword:'劍士',archer:'妖精',mage:'法師'}[c]} ${p||'初始'} · ${n}`,i)));sel.value=15;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),cache=new Map();let playing=true,start=0,current=0;
function img(src){if(!cache.has(src)){const i=new Image;i.src=src;cache.set(src,i)}return cache.get(src)}
function render(k){current=k;const [cls,path,name]=groups[+sel.value],gender=document.querySelector('#gender').value,p=RpgSkillFX.profile(document.querySelector("#attack").value==="basic"?"":name,cls,path);p.basic=document.querySelector("#attack").value==="basic";document.querySelector('#detail').textContent=`${name} · ${desc[p.kind]} · 同技能於高轉職階段增加規模`;ctx.clearRect(0,0,1000,500);const asset=cls==='sword'?`art/v2/hero_${path?`adv1_sword_${path[0]}`:'sword'}_${gender}.webp`:`art/${cls==='mage'?'mage':'elf'}-adv1-hd-20261011/hero_adv1_${cls==='mage'?'mage':'archer'}_${path[0]||'A'}_${gender}.png`;const hero=img(asset),monster=img('art/monsters-clean-20261011/mon_olive_guardian.png');if(hero.complete&&hero.naturalWidth)ctx.drawImage(hero,15,75,350,350);if(monster.complete&&monster.naturalWidth)ctx.drawImage(monster,730,135,220,270);ctx.save();ctx.strokeStyle='#6a8091';ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(30,404);ctx.lineTo(970,404);ctx.stroke();ctx.restore();RpgSkillFX.draw(ctx,k,{x:285,y:245},{x:815,y:265},p);document.querySelector('#progress').value=Math.round(k*100)}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暫停':'播放';start=performance.now()-current*1800};document.querySelector('#progress').oninput=e=>{playing=false;document.querySelector('#play').textContent='播放';render(+e.target.value/100)};sel.onchange=()=>{start=performance.now();render(0)};document.querySelector('#gender').onchange=()=>render(current);
document.querySelector('#attack').onchange=()=>render(current);window.skillPreview={groups,render,select:i=>{sel.value=i;render(.5)},pause:()=>playing=false};requestAnimationFrame(function tick(t){if(playing){if(!start)start=t;render(((t-start)%2400)/2400*.999)}requestAnimationFrame(tick)});
</script></html>
