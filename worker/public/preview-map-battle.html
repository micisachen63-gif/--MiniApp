</style></head><body><main class="panel"><h1 id="title">男劍士｜揮擊・斬擊</h1><p class="desc">戰鬥動作與希臘神話地圖預覽。地圖每 10 級切換。</p><div class="tabs"><button id="sword_m" class="active">⚔️ 男劍士</button><button id="mage_m">🔮 男法師</button><button id="archer_m">🏹 男妖精</button><button id="archer_f">🏹 女妖精</button><button id="adv1_archer_A_m">🏹 男遊俠</button><button id="adv1_archer_B_m">🦅 男獵人</button><button id="sword_f">⚔️ 女劍士</button></div><div id="stage"></div><div class="mapcontrol"><b>🗺️ 地圖等級</b><input id="mapLevel" type="range" min="1" max="120" value="1"><span id="mapRange"></span></div><p id="note" class="note">劍士：蓄力 → 揮擊 → 收勢回復。</p></main>

<script src="/map-motion.js?v=20261012-video-complete"></script><script src="/battle.js?v=20261011-cinema-3"></script><script>
const prefix='/art/v2/';
const art={hero:{sword_f:'hero_sword_f',sword_m:'hero_sword_m',archer_f:'hero_archer_f',archer_m:'hero_archer_m',adv1_archer_A_m:'hero_adv1_archer_A_m',adv1_archer_B_m:'hero_adv1_archer_B_m',mage_f:'hero_mage_f',mage_m:'hero_mage_m'},monster:{'史萊姆':'mon_slime_novice','月光野兔':'mon_moon_hare','月桂樹精':'mon_laurel_treant','林地花仙':'mon_wood_nymph','林精斥候':'mon_forest_scout','月桂巨樹精':'boss_ancient_laurel'},elite:{'哥布林突擊隊長':'elite_goblin_captain','阿耳忒彌斯巡林長':'elite_artemis_ranger'},monsterAnim:{'史萊姆':'mon_slime_attack','月光野兔':'mon_moon_hare_attack','月桂樹精':'mon_laurel_treant_attack','林地花仙':'mon_wood_nymph_attack','林精斥候':'mon_forest_scout_attack','阿耳忒彌斯巡林長':'elite_artemis_ranger_attack','月桂巨樹精':'boss_ancient_laurel_attack'},eliteAnim:{'阿耳忒彌斯巡林長':'elite_artemis_ranger_attack'},map:{1:'bg_map1'},item:{gold:'item_gold'}};
const src=(kind,key)=>{if((kind==='hero'||kind==='sprite')&&/^archer_[fm]$/.test(String(key)))return `/art/elf-v2-20261010/hero_${key}.webp`;if(kind==='map'&&/^myth(?:0[1-9]|1[0-2])$/.test(String(key)))return `${prefix}bg_${key}.webp?v=20261010-greek-maps-1`;let f=art[kind]?.[key];if(kind==='map'&&!f)f=key==='town'?'bg_town':art.map[key];return f?`${prefix}${f}.webp${f==='hero_archer_m'?'?v=202609-archer-m-2':f.startsWith('hero_adv1_archer_')?'?v=20261009-adv1-archer-branches-2':['sword_f','sword_m','mage_m'].some(k=>f===`hero_${k}`)?'?v=20261009-hero-refresh-2':''}`:null};
const heroAnims={adv1_archer_A_m:{src:`${prefix}hero_adv1_archer_A_m_attack.webp?v=20261009-adv1-archer-branches-2`,cols:5,rows:2,firstFrame:1},adv1_archer_B_m:{src:`${prefix}hero_adv1_archer_B_m_attack.webp?v=20261009-adv1-archer-branches-2`,cols:5,rows:2,firstFrame:1},archer_f:{src:`/art/elf-v2-20261010/hero_archer_f_attack.webp`,cols:5,rows:2,firstFrame:0},archer_m:{src:`/art/elf-v2-20261010/hero_archer_m_attack.webp`,cols:5,rows:2,firstFrame:0},mage_f:{src:`${prefix}hero_mage_f_attack.webp`,cols:4,rows:2,firstFrame:0},mage_m:{src:`${prefix}hero_mage_m_attack.webp?v=20261009-male-refresh`,cols:4,rows:2,firstFrame:2},sword_m:{src:`${prefix}hero_sword_m_attack.webp?v=20261009-male-refresh`,cols:4,rows:2,firstFrame:3},sword_f:{src:`${prefix}hero_sword_f_attack.webp?v=20261009-hero-refresh-2`,cols:5,rows:2,firstFrame:3}};
const b=RpgBattle.create({src,items:{},fmt:n=>String(n),stateInfo:()=>({text:'⚔️ 戰鬥中',cls:''}),heroKey:c=>c.baseClass==='archer'&&c.classPath?`adv1_archer_${c.classPath}_${c.gender}`:`${c.baseClass}_${c.gender}`,heroMeta:()=>({fig:[.003,.003,.997,.997]}),heroAnim:k=>heroAnims[k]||null});
document.querySelector('#stage').appendChild(b.el);
const me={character:{name:'阿基里斯',baseClass:'archer',gender:'m',classPath:'',mapId:1,mapName:'🌿 阿耳忒彌斯月桂林',state:'fighting',hp:320,maxHp:320,mp:180,maxMp:180,level:1},battle:{atk:28,crit:.12,skill:{mult:1.8,cost:8,name:'穿雲箭'},taken:.8,hpLossPerTick:5,eliteBurst:12,monsters:['月光野兔','月桂樹精','林地花仙','林精斥候','月桂巨樹精'],elite:'阿耳忒彌斯巡林長'}};
const ids=['sword_m','mage_m','archer_m','archer_f','adv1_archer_A_m','adv1_archer_B_m','sword_f'];
function select(key){const isBranch=key.startsWith('adv1_archer_'),cls=isBranch?'archer':key.split('_')[0],gender=isBranch?'m':key.split('_')[1],path=isBranch?key.split('_')[2]:'';me.character.baseClass=cls;me.character.gender=gender;me.character.classPath=path;me.battle.skill.name=path==='A'?'箭雨':path==='B'?'獵鷹助攻':cls==='archer'?'穿雲箭':cls==='mage'?'奧術飛彈':'斬鋼';b.sync(me,null);document.querySelector('#title').textContent=({sword_m:'男劍士｜揮擊・斬擊',mage_m:'男法師｜蓄力・施法',archer_m:'男妖精｜拉弓・放箭',archer_f:'女妖精｜拉弓・放箭',adv1_archer_A_m:'一轉遊俠｜複合弓・箭雨',adv1_archer_B_m:'一轉獵人｜十字弩・獵鷹助攻',sword_f:'女劍士｜揮擊・斬擊'})[key];document.querySelector('#note').textContent=path==='A'?'遊俠：蓄弦 → 金色箭矢連射 → 箭雨 → 收勢。':path==='B'?'獵人：獵鷹起飛 → 十字弩瞄準 → 弩箭與獵鷹協同攻擊。':cls==='sword'?'劍士：蓄力 → 揮擊命中 → 收勢回復。':cls==='archer'?(gender==='f'?'女妖精：抬弓 → 拉弦 → 放箭 → 收勢。':'男妖精：抬弓 → 拉弦 → 放箭 → 收勢。'):'法師：蓄力 → 前推施法 → 收勢。';for(const id of ids)document.getElementById(id).classList.toggle('active',id===key);}
for(const id of ids)document.getElementById(id).onclick=()=>select(id);select('sword_m');b.attach(document.querySelector('#stage'));
const mapLevel=document.querySelector('#mapLevel');function setMapLevel(level){me.character.level=Number(level);const scene=window.RpgMaps.get(me.character.level);document.querySelector('#mapRange').textContent=`Lv.${scene.min}–${scene.max} · ${scene.emoji} ${scene.name}`;b.sync(me,null)}mapLevel.oninput=()=>setMapLevel(mapLevel.value);setMapLevel(1);
</script></body></html>
