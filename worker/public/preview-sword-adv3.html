<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>劍士三轉・角色與動作</title><style>body{margin:0;padding:20px;background:#0d1724;color:#ead8b3;font:16px system-ui}h1{font-size:25px}p{color:#adbdcf}select,button,input{font:inherit;padding:9px;color:#eddfc0;background:#213249;border:1px solid #53647a;border-radius:7px;margin:4px}.layout{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,800px);gap:18px;align-items:start}#portrait{width:100%;height:460px;object-fit:contain;background:radial-gradient(ellipse,#293b51,transparent 68%)}canvas{width:100%;display:block;background:radial-gradient(ellipse at 70% 65%,#2b3b4f,#142133);border:1px solid #576478;border-radius:12px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}.frame{padding:2px;aspect-ratio:1;background-size:400% 400%;border:1px solid #63708044;border-radius:6px}.frame.active{border-color:#eacb8a}#progress{width:240px}#status{font-size:13px}@media(max-width:700px){.layout{grid-template-columns:1fr}#portrait{height:300px}.frames{grid-template-columns:repeat(4,1fr)}}
</style><h1>劍士三轉・角色與動作</h1><p>寫實奇幻角色 · 血怒、劍聖、聖光、鐵壁八條傳承分支 · 男女角色與完整攻擊循環</p><select id="branch"><option value="A11">血獄魔刃 · A11</option><option value="A12">赤炎戰皇 · A12</option><option value="A21">天痕劍皇 · A21</option><option value="A22">影月劍聖 · A22</option><option value="B11">曙光聖裁者 · B11</option><option value="B12">星誓守護者 · B12</option><option value="B21">玄鋼鎮衛 · B21</option><option value="B22">蒼雷壁壘 · B22</option></select><select id="gender"><option value="f">女角色</option><option value="m">男角色</option></select><select id="speed"><option value="1200">正常速度</option><option value="1800">慢速檢視</option><option value="800">快速檢視</option></select><button id="play">暫停</button><label><input type="checkbox" id="fx" checked>技能特效</label><p id="status">載入中…</p><div class="layout"><img id="portrait" alt="角色立繪"><div><canvas width="720" height="400"></canvas><input id="progress" type="range" min="0" max="15" value="0"><div class="frames"></div></div></div><script src="skill-fx.js"></script><script src="cinematic-fx.js"></script><script src="hero-lavish-fx.js?v=20261012-bold-2"></script><script>
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),cache=new Map(),skills={A11:'血之狂怒',A12:'血之狂怒',A21:'一閃',A22:'一閃',B11:'神聖制裁',B12:'神聖制裁',B21:'不動如山',B22:'不動如山'};let manifest,sheet,key,playing=true,start=performance.now(),current=0,run=0;const mob=new Image();mob.src='art/monsters-clean-20261011/mon_olive_guardian.png';
async function select(branch=document.querySelector('#branch').value,gender=document.querySelector('#gender').value){const id=++run,selectedKey='adv3_sword_'+branch+'_'+gender;document.querySelector('#branch').value=branch;document.querySelector('#gender').value=gender;if(!manifest)manifest=await(await fetch('art/sword-adv3-hd-20261012/manifest.json')).json();const src='art/sword-adv3-hd-20261012/hero_'+selectedKey;document.querySelector('#portrait').src=src+'_portrait.png';let image=cache.get(selectedKey);if(!image){image=new Image();image.src=src+'_attack.webp';await image.decode();cache.set(selectedKey,image);if(cache.size>2)cache.delete(cache.keys().next().value);}if(id!==run)return;key=selectedKey;sheet=image;document.querySelector('.frames').innerHTML=Array.from({length:16},(_,i)=>`<button class="frame" data-f="${i}" style="background-image:url('${src}_attack.webp');background-position:${i%4/3*100}% ${Math.floor(i/4)/3*100}%" aria-label="第 ${i+1} 格"></button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{pause();render(+b.dataset.f)});start=performance.now();render(0);}
function render(frame,progress=frame/15){if(!sheet)return;current=frame;g.clearRect(0,0,720,400);const scale=manifest[key].heightScale,size=270*scale,ground=345;g.drawImage(sheet,frame%4*768,Math.floor(frame/4)*768,768,768,12-size/16,ground-size*15/16,size,size);if(mob.complete&&mob.naturalWidth)g.drawImage(mob,535,165,145,180);if(document.querySelector('#fx').checked&&progress>=.30){const p=RpgSkillFX.profile(skills[document.querySelector('#branch').value],'sword',document.querySelector('#branch').value),k=(progress-.30)/(.34/.65);RpgSkillFX.draw(g,k,{x:235,y:230},{x:605,y:235},p);}document.querySelector('#progress').value=frame;document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('active',+b.dataset.f===frame));document.querySelector('#status').textContent=`${document.querySelector('#branch').selectedOptions[0].textContent} · ${key.endsWith('_f')?'女':'男'} · 第 ${frame+1} / 16 格`;}
function pause(){playing=false;document.querySelector('#play').textContent='播放';}document.querySelector('#play').onclick=()=>{playing=!playing;start=performance.now();document.querySelector('#play').textContent=playing?'暫停':'播放';};for(const id of ['branch','gender'])document.querySelector('#'+id).onchange=()=>select();document.querySelector('#progress').oninput=e=>{pause();render(+e.target.value)};document.querySelector('#fx').onchange=()=>render(current);window.swordPreview={select,render,pause,get manifest(){return manifest}};select();requestAnimationFrame(function tick(t){if(playing&&sheet){const duration=+document.querySelector('#speed').value,p=((t-start)%(duration+650))/duration;if(p>=1)render(0,0);else{const phase=p<.4?.35*p/.4:p<.64?.35+.38*(p-.4)/.24:.73+.27*(p-.64)/.36;render(Math.min(15,Math.floor(phase*16)),p);}}requestAnimationFrame(tick)});
</script></html>
