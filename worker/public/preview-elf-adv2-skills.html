<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妖精二轉・華麗技能特效</title><style>:root{color-scheme:dark;font-family:system-ui;color:#f3e7d3;background:#0b1421}body{max-width:1250px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 8px}p{color:#acbed0}header{margin-bottom:24px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#233249;border:1px solid #66768b;color:#f1e3c5;font:inherit;border-radius:8px;padding:9px 16px;cursor:pointer}input{accent-color:#d6b77c;max-width:36vw}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{background:#142133;border:1px solid #384a61;border-radius:14px;overflow:hidden}h2{font-size:19px;margin:16px 18px 6px}article p{margin:0 18px 12px;font-size:13px}canvas{width:100%;aspect-ratio:1.6;display:block;background:radial-gradient(ellipse at center,#233b4d,#101c2b)}footer{color:#9eafc3;font-size:12px;margin:20px 0}@media(max-width:720px){body{padding:14px}main{grid-template-columns:1fr}h1{font-size:23px}}</style><body><header><h1>妖精二轉・華麗技能特效</h1><p>細緻手繪魔法 · 蓄力、發射、命中與消散</p><div class="tools"><button id="toggle">暫停</button><button id="mode">切換普通攻擊</button><label>影格 <input id="seek" type="range" min="0" max="100" value="0"></label><span id="phase">準備</span></div></header><main id="cards"></main><footer>此頁展示技能特效。傷害、血量與角色攻擊時機由遊戲戰鬥紀錄控制。</footer><script src="skill-fx.js?v=20261011-skill-fx-1"></script><script src="elf-adv2-skill-fx.js?v=20261013-elf2-skills1"></script><script>
window.skillPreview={playing:true,basic:false,time:0};(async()=>{const specs=[['A1','穿透狙擊','逐風神射・青金貫穿光箭'],['A2','疾風連射','蒼穹風舞・六箭交錯風流'],['B1','野獸之王','森靈馭獸・狼鷹雙靈衝擊'],['B2','爆裂陷阱','月影獵使・月紋法陣與爆裂碎光']],items=[];await Promise.all(specs.map(([p])=>RpgElfSkillFX.prepare('archer',p)));for(const[path,name,desc]of specs){const card=document.createElement('article');card.innerHTML=`<h2>${name}</h2><p>${desc}</p><canvas width="640" height="400"></canvas>`;cards.append(card);const hero=new Image(),mon=new Image();hero.src='art/elf-adv2-magic-20261013/hero_adv2_archer_'+path+'_f.webp';mon.src='art/monsters-clean-20261011/mon_olive_guardian.png';await Promise.all([hero.decode(),mon.decode()]);items.push({path,name,g:card.querySelector('canvas').getContext('2d'),hero,mon});}
skillPreview.paint=t=>{skillPreview.time=t;for(const o of items){const g=o.g;g.clearRect(0,0,640,400);const gradient=g.createLinearGradient(0,0,0,400);gradient.addColorStop(0,'#0e1a2b');gradient.addColorStop(1,'#273b44');g.fillStyle=gradient;g.fillRect(0,0,640,400);g.globalAlpha=.22;g.fillStyle='#7ba7a9';g.fillRect(25,346,590,2);g.globalAlpha=1;g.drawImage(o.hero,20,102,240,240);g.drawImage(o.mon,432,135,160,208);if(t>=.34&&t<=1){const k=(t-.34)/.66;RpgSkillFX.draw(g,k,{x:214,y:211},{x:497,y:235},{...RpgSkillFX.profile(o.name,'archer',o.path),basic:skillPreview.basic});}}seek.value=Math.round(t*100);phase.textContent=t<.34?'準備':t<.49?'蓄力':t<.77?'發射與衝擊':t<.9?'命中爆發':'消散'};let start=null;function tick(ts){if(skillPreview.playing){start??=ts;skillPreview.paint(((ts-start)%3500)/3500)}requestAnimationFrame(tick)}toggle.onclick=()=>{skillPreview.playing=!skillPreview.playing;toggle.textContent=skillPreview.playing?'暫停':'播放';start=null};mode.onclick=()=>{skillPreview.basic=!skillPreview.basic;mode.textContent=skillPreview.basic?'切換技能攻擊':'切換普通攻擊'};seek.oninput=()=>{skillPreview.playing=false;toggle.textContent='播放';skillPreview.paint(Number(seek.value)/100)};skillPreview.paint(0);skillPreview.ready=true;requestAnimationFrame(tick);})();
</script></body></html>
