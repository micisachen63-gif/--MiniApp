<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>希臘神話地圖預覽</title>
<link rel="stylesheet" href="/battle.css?v=20261011-video-1"><style>
*{box-sizing:border-box}body{margin:0;background:#0b1224;color:#f3e4b7;font:15px system-ui,sans-serif;padding:22px}.wrap{width:min(1100px,100%);margin:auto}h1{font:700 25px Georgia,serif;margin:0 0 6px}.sub{color:#c7c1b1;margin:0 0 18px}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#18233e;border:1px solid #b58d3b;border-radius:10px;padding:12px 16px;margin-bottom:14px}.controls input{accent-color:#e8c36e;flex:1;min-width:180px}.lvl{font-weight:800;color:#ffe4a0;min-width:100px}.bstage{height:clamp(270px,48vw,540px);border:2px solid #c8a454;border-radius:12px;margin:0!important}.bstage .bg{inset:0;background-position:center 84%;background-size:cover;transition:background-image .55s ease}.bstage .mapname{font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}.mapcard{background:#18233e;border:1px solid #6d582f;border-radius:8px;overflow:hidden;color:#f3e4b7;padding:0;text-align:left;cursor:pointer}.mapcard:hover,.mapcard.active{border-color:#ffe4a0;box-shadow:0 0 0 1px #ffe4a0}.mapcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.mapcard b,.mapcard small{display:block;padding:0 10px}.mapcard b{padding-top:8px}.mapcard small{padding-bottom:9px;color:#d3c39a}.bstage.rm .bg:before,.bstage.rm .environment{animation:none}.controls button{border:1px solid #9a7b43;background:#283047;color:#f5dfab;border-radius:7px;padding:8px 12px;cursor:pointer}
</style></head><body><main class="wrap"><h1>希臘神話地圖｜Lv.1–120</h1><p class="sub">十二個神域，各自擁有風、光、水與遠近層次。選擇地圖，感受不同環境。</p>
<div class="controls"><b>角色等級</b><input id="level" type="range" min="1" max="120" value="1"><span class="lvl" id="range"></span><button id="tour" type="button">巡遊全部地圖</button><button id="motion" type="button" aria-pressed="true">動畫：開</button></div>
<div class="bstage" id="stage"><div class="world"><div class="bg" id="bg"></div><div class="environment" aria-hidden="true"></div></div><div class="mapname" id="name"></div></div><p id="ambience" class="sub" style="margin-top:12px"></p><section class="cards" id="cards"></section></main>
<script src="/maps.js?v=1"></script><script src="map-video.js?v=20261012-video-complete"></script>
<script src="/map-motion.js?v=20261012-video-complete"></script><script>
const maps=window.RpgMaps, bg=document.querySelector('#bg'),level=document.querySelector('#level'),name=document.querySelector('#name'),range=document.querySelector('#range'),cards=document.querySelector('#cards');
function show(lv){const m=maps.get(lv),key=maps.key(lv);level.value=lv;document.querySelector("#ambience").textContent=RpgMapMotion.profiles[m.id].title;range.textContent=`Lv.${m.min}–${m.max}`;name.textContent=`${m.emoji} ${m.name} · Lv.${m.min}–${m.max}`;bg.style.backgroundImage=`url("/art/v2/bg_${key}.webp?v=20261010-greek-maps-1")`;document.querySelector('#stage').dataset.scene=m.id;document.querySelectorAll('.mapcard').forEach(c=>c.classList.toggle('active',Number(c.dataset.id)===m.id));}
maps.scenes.forEach(m=>{const c=document.createElement('button');c.className='mapcard';c.dataset.id=m.id;c.innerHTML=`<img src="/art/v2/bg_myth${String(m.id).padStart(2,'0')}.webp?v=20261010-greek-maps-1" loading="lazy" alt=""><b>${m.emoji} ${m.name}</b><small>Lv.${m.min}–${m.max} · ${m.mood}</small>`;c.onclick=()=>show(m.min);cards.append(c)});
level.oninput=()=>show(Number(level.value));show(1);let stopMotion=window.RpgMapMotion.attach(document.querySelector('#stage'),bg);let running=true,timer=null;
document.querySelector('#motion').onclick=()=>{running=!running;const button=document.querySelector('#motion');button.textContent='動畫：'+(running?'開':'關');button.setAttribute('aria-pressed',String(running));document.querySelector('#stage').classList.toggle('rm',!running);if(running)stopMotion=RpgMapMotion.attach(document.querySelector('#stage'),bg);else stopMotion();};
document.querySelector('#tour').onclick=()=>{const button=document.querySelector('#tour');if(timer){clearInterval(timer);timer=null;button.textContent='巡遊全部地圖';return;}show(1);button.textContent='停止巡遊';timer=setInterval(()=>{if(!document.hidden)show((maps.get(Number(level.value)).id%12)*10+1);},6500);};
</script></body></html>
