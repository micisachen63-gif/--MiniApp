<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法師一轉・高畫質動畫驗收</title>
<style>body{margin:0;padding:24px;background:#111b2a;color:#eedbbb;font:16px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{background:#1c2b3d;border:1px solid #596374;border-radius:12px;padding:12px}canvas{width:100%;background:radial-gradient(ellipse at 50% 80%,#455363,#1c2b3d 70%)}button,input{font:inherit;margin:8px;padding:8px}p{color:#b1becc}@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}</style>
<h1>法師一轉・高畫質動畫驗收</h1><p>四套角色 · 每格 512 × 512 · 12 格 · 透明背景 · 同一套動畫維持統一縮放與腳底基線</p><button id="play">暫停</button><label>影格 <input id="frame" type="range" min="0" max="11" value="0"><span id="number">1 / 12</span></label><main></main>
<script>
const keys=['A_f','A_m','B_f','B_m'],names=['元素法師・女','元素法師・男','秘法師・女','秘法師・男'];let playing=true,current=0,last=0;const entries=[];
const ready=Promise.all(keys.map((key,i)=>new Promise((resolve,reject)=>{const article=document.createElement('article');article.innerHTML=`<h2>${names[i]}</h2><canvas width="512" height="512"></canvas><a href="art/mage-adv1-hd-20261011/hero_adv1_mage_${key}_attack.png" style="color:#e9cf98">開啟完整影格圖</a>`;document.querySelector('main').append(article);const image=new Image;image.onload=()=>{entries.push({key,image,ctx:article.querySelector('canvas').getContext('2d')});resolve()};image.onerror=reject;image.src=`art/mage-adv1-hd-20261011/hero_adv1_mage_${key}_attack.png`})));
function render(frame){current=frame;document.querySelector('#frame').value=frame;document.querySelector('#number').textContent=`${frame+1} / 12`;for(const {image,ctx}of entries){ctx.clearRect(0,0,512,512);ctx.drawImage(image,frame%4*512,Math.floor(frame/4)*512,512,512,0,0,512,512)}}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暫停':'播放'};document.querySelector('#frame').oninput=e=>{playing=false;document.querySelector('#play').textContent='播放';render(+e.target.value)};
window.preview={ready,render,entries,pause:()=>playing=false};ready.then(()=>{render(0);requestAnimationFrame(function tick(t){if(playing&&t-last>150){render((current+1)%12);last=t}requestAnimationFrame(tick)})});
</script></html>
